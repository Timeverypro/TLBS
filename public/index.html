<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Community Library & Barcode System</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Barcode & QR Scanner -->
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <!-- Barcode Generator Library -->
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@11.5.0/dist/JsBarcode.all.min.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 md:p-8">

  <div class="max-w-4xl mx-auto space-y-8">
    <!-- Header -->
    <header class="text-center space-y-2">
      <h1 class="text-3xl font-extrabold text-indigo-400">📚 Community Library System</h1>
      <p class="text-slate-400">Track copies via ISBN & scan custom physical barcodes</p>
    </header>

    <!-- Navigation / Action Tabs -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      
      <!-- Left: Barcode Scanner Section -->
      <section class="bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-xl space-y-4">
        <h2 class="text-xl font-bold text-slate-200">📷 Scan Physical Barcode</h2>
        <div id="reader" class="w-full bg-slate-950 rounded-xl overflow-hidden border border-slate-800"></div>
        <div id="scan-result" class="hidden p-4 rounded-xl bg-indigo-950/50 border border-indigo-500/30 text-indigo-300 text-sm"></div>
      </section>

      <!-- Right: Register Book & Generate Barcode -->
      <section class="bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-xl space-y-4">
        <h2 class="text-xl font-bold text-slate-200">🏷️ Add Book & Print Barcode</h2>
        <form id="add-book-form" class="space-y-3">
          <div>
            <label class="block text-xs font-semibold text-slate-400 mb-1">Book Title</label>
            <input type="text" id="title" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-indigo-500" placeholder="e.g., Mathematics Vol. 1">
          </div>
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="block text-xs font-semibold text-slate-400 mb-1">Author</label>
              <input type="text" id="author" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-indigo-500" placeholder="Author name">
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-400 mb-1">ISBN (For Title Grouping)</label>
              <input type="text" id="isbn" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-indigo-500" placeholder="978-...">
            </div>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-400 mb-1">Custom Copy Barcode ID (Unique per physical book)</label>
            <div class="flex gap-2">
              <input type="text" id="barcodeId" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm font-mono text-indigo-300 focus:outline-none focus:border-indigo-500" placeholder="TLBS-COPY-001">
              <button type="button" onclick="generateRandomBarcode()" class="px-3 py-2 bg-slate-700 hover:bg-slate-600 text-xs rounded-lg font-medium transition">Generate</button>
            </div>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-400 mb-1">Owner User ID</label>
            <input type="number" id="ownerId" value="1" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100">
          </div>
          <button type="submit" class="w-full py-2.5 bg-indigo-600 hover:bg-indigo-500 font-semibold text-sm rounded-lg transition shadow-lg shadow-indigo-600/20">
            Save Book & Generate Barcode Label
          </button>
        </form>
      </section>

    </div>

    <!-- Printable Barcode Preview Box (Hidden until generated) -->
    <div id="barcode-preview-box" class="hidden bg-white text-slate-900 p-6 rounded-2xl shadow-2xl text-center space-y-4 max-w-md mx-auto">
      <h3 class="font-bold text-lg text-slate-800">Printable Book Barcode Label</h3>
      <div class="flex justify-center"><svg id="barcode-svg"></svg></div>
      <p id="preview-book-info" class="text-xs font-medium text-slate-600"></p>
      <button onclick="window.print()" class="px-4 py-2 bg-slate-900 text-white text-xs font-bold rounded-lg hover:bg-slate-800">🖨️ Print Label</button>
    </div>

    <!-- Book Catalog -->
    <section class="space-y-4">
      <div class="flex justify-between items-center">
        <h2 class="text-xl font-bold text-slate-200">📖 Library Catalog & Copy Counts</h2>
        <button onclick="fetchBooks()" class="px-3 py-1.5 text-xs bg-slate-800 hover:bg-slate-700 rounded-lg border border-slate-700 transition">🔄 Refresh</button>
      </div>
      <div id="book-list" class="grid gap-4 sm:grid-cols-2">
        <p class="text-slate-500 text-sm italic col-span-2">Loading library catalog...</p>
      </div>
    </section>
  </div>

  <script>
    const API_URL = '/api/books';

    // Auto-generate random unique custom barcode ID
    function generateRandomBarcode() {
      const randomCode = 'TLBS-' + Math.floor(100000 + Math.random() * 900000);
      document.getElementById('barcodeId').value = randomCode;
    }

    // Fetch and display all books with ISBN counts
    async function fetchBooks() {
      const container = document.getElementById('book-list');
      try {
        const res = await fetch(API_URL);
        const books = await res.json();
        
        if (!books.length) {
          container.innerHTML = `<p class="text-slate-500 text-sm italic col-span-2">No books found in the library database.</p>`;
          return;
        }

        container.innerHTML = books.map(book => `
          <div class="bg-slate-800 border border-slate-700 p-5 rounded-xl space-y-3 shadow-md">
            <div class="flex justify-between items-start gap-2">
              <div>
                <h3 class="font-bold text-slate-100 text-lg">${escapeHtml(book.title)}</h3>
                <p class="text-xs text-slate-400">by ${escapeHtml(book.author || 'Unknown')} | ISBN: <span class="text-indigo-300">${escapeHtml(book.isbn || 'N/A')}</span></p>
              </div>
              <span class="px-2.5 py-1 text-xs font-semibold rounded-full ${
                book.status === 'available' ? 'bg-emerald-950 text-emerald-400 border border-emerald-800' : 'bg-amber-950 text-amber-400 border border-amber-800'
              }">
                ${book.status}
              </span>
            </div>

            <div class="flex items-center justify-between text-xs text-slate-400 pt-2 border-t border-slate-700/50">
              <span>Copy Barcode: <code class="font-mono text-indigo-300 bg-slate-900 px-1.5 py-0.5 rounded">${escapeHtml(book.barcode_id)}</code></span>
              <span>Owner ID: ${book.owner_id}</span>
            </div>
          </div>
        `).join('');
      } catch (err) {
        container.innerHTML = `<p class="text-rose-400 text-sm col-span-2">Failed to load catalog: ${err.message}</p>`;
      }
    }

    // Handle Form Submit to add new book copy
    document.getElementById('add-book-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const payload = {
        title: document.getElementById('title').value,
        author: document.getElementById('author').value,
        isbn: document.getElementById('isbn').value,
        barcodeId: document.getElementById('barcodeId').value,
        ownerId: parseInt(document.getElementById('ownerId').value),
        description: "Registered physical book copy"
      };

      try {
        const res = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        if (data.success) {
          alert('Book copy registered successfully!');
          
          // Render Barcode SVG preview so they can print it immediately
          document.getElementById('barcode-preview-box').classList.remove('hidden');
          JsBarcode("#barcode-svg", payload.barcodeId, { format: "CODE128", width: 2, height: 60, displayValue: true });
          document.getElementById('preview-book-info').innerText = `${payload.title} (ISBN: ${payload.isbn || 'N/A'})`;

          fetchBooks();
          document.getElementById('add-book-form').reset();
        } else {
          alert('Error: ' + data.error);
        }
      } catch (err) {
        alert('Failed to connect to server.');
      }
    });

    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
    }

    // Initialize Barcode Scanner
    function onScanSuccess(decodedText) {
      const resultDiv = document.getElementById('scan-result');
      resultDiv.classList.remove('hidden');
      resultDiv.innerHTML = `<strong>Scanned Copy Barcode:</strong> ${escapeHtml(decodedText)} <br><span class="text-xs text-emerald-400">Ready to borrow/return!</span>`;
    }

    const html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: { width: 250, height: 150 } }, false);
    html5QrcodeScanner.render(onScanSuccess);

    fetchBooks();
  </script>
</body>
</html>
