<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Community Library System</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Barcode & QR Scanner Library -->
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 md:p-8">

  <div class="max-w-4xl mx-auto space-y-8">
    <!-- Header -->
    <header class="text-center space-y-2">
      <h1 class="text-3xl font-extrabold text-indigo-400">📚 Community Library System</h1>
      <p class="text-slate-400">Cataloging, ISBN grouping, member management, and loan tracking</p>
    </header>

    <!-- Top Grid: Forms & Actions -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      
      <!-- Left Column: Add Book & Register User -->
      <div class="space-y-6">
        <!-- Add Book Form -->
        <section class="bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-xl space-y-4">
          <h2 class="text-xl font-bold text-slate-200">➕ Add Book Copy</h2>
          <form id="add-book-form" class="space-y-3">
            <div>
              <label class="block text-xs font-semibold text-slate-400 mb-1">Book Title</label>
              <input type="text" id="title" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-indigo-500" placeholder="e.g., Mathematics Vol. 1">
            </div>
            <div class="grid grid-cols-2 gap-2">
              <div>
                <label class="block text-xs font-semibold text-slate-400 mb-1">Author</label>
                <input type="text" id="author" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-indigo-500" placeholder="Author name">
              </div>
              <div>
                <label class="block text-xs font-semibold text-slate-400 mb-1">ISBN</label>
                <input type="text" id="isbn" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-indigo-500" placeholder="978-...">
              </div>
            </div>
            <div class="grid grid-cols-2 gap-2">
              <div>
                <label class="block text-xs font-semibold text-slate-400 mb-1">Barcode ID</label>
                <input type="text" id="barcodeId" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm font-mono text-indigo-300 focus:outline-none focus:border-indigo-500" placeholder="e.g., 12121">
              </div>
              <div>
                <label class="block text-xs font-semibold text-slate-400 mb-1">Owner User ID</label>
                <input type="number" id="ownerId" value="1" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100">
              </div>
            </div>
            <button type="submit" class="w-full py-2.5 bg-indigo-600 hover:bg-indigo-500 font-semibold text-sm rounded-lg transition shadow-lg shadow-indigo-600/20">
              Save Book Copy
            </button>
          </form>
        </section>

        <!-- Register Member Form -->
        <section class="bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-xl space-y-4">
          <h2 class="text-xl font-bold text-slate-200">👤 Register New Member</h2>
          <form id="add-user-form" class="space-y-3">
            <div>
              <label class="block text-xs font-semibold text-slate-400 mb-1">Full Name</label>
              <input type="text" id="user-name" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-indigo-500" placeholder="e.g., Sarah Smith">
            </div>
            <button type="submit" class="w-full py-2.5 bg-teal-600 hover:bg-teal-500 font-semibold text-sm rounded-lg transition shadow-lg shadow-teal-600/20">
              Register Member
            </button>
          </form>
          <div class="pt-2 border-t border-slate-700">
            <p class="text-xs font-semibold text-slate-400 mb-2">Registered Members Directory:</p>
            <div id="user-list" class="max-h-28 overflow-y-auto space-y-1 text-xs text-slate-300">
              <span class="italic text-slate-500">Loading members...</span>
            </div>
          </div>
        </section>
      </div>

      <!-- Right Column: Checkout / Return Action Panel & Camera Scanner -->
      <section class="bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-xl space-y-4">
        <h2 class="text-xl font-bold text-slate-200">🔄 Checkout / Return</h2>
        
        <!-- Camera Scanner for Actions -->
        <div class="space-y-1">
          <label class="block text-xs font-semibold text-slate-400">Scan Barcode with Camera</label>
          <div id="action-reader" class="w-full bg-slate-950 rounded-xl overflow-hidden border border-slate-700 text-xs"></div>
        </div>

        <div class="space-y-3 pt-2">
          <div>
            <label class="block text-xs font-semibold text-slate-400 mb-1">Physical Copy Barcode ID (Scanned or Typed)</label>
            <input type="text" id="action-barcode" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm font-mono text-indigo-300 focus:outline-none focus:border-indigo-500" placeholder="Scan or type barcode...">
          </div>
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="block text-xs font-semibold text-slate-400 mb-1">Borrower User ID</label>
              <input type="number" id="borrower-id" value="1" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100">
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-400 mb-1">Manual Due Date</label>
              <input type="date" id="action-duedate" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-indigo-500">
            </div>
          </div>
          <div class="grid grid-cols-2 gap-3 pt-2">
            <button onclick="handleLoan('borrow')" class="w-full py-2.5 bg-emerald-600 hover:bg-emerald-500 font-semibold text-sm rounded-lg transition shadow-lg shadow-emerald-600/20">
              📥 Borrow Book
            </button>
            <button onclick="handleLoan('return')" class="w-full py-2.5 bg-amber-600 hover:bg-amber-500 font-semibold text-sm rounded-lg transition shadow-lg shadow-amber-600/20">
              📤 Return Book
            </button>
          </div>
        </div>
      </section>

    </div>

    <!-- Book Catalog Section -->
    <section class="space-y-4">
      <div class="flex flex-col sm:flex-row justify-between items-stretch sm:items-center gap-3">
        <h2 class="text-xl font-bold text-slate-200">📖 Library Catalog & Loans</h2>
        <div class="flex gap-2">
          <input type="text" id="search-input" oninput="filterBooks()" placeholder="Search title, author, ISBN, borrower..." class="bg-slate-800 border border-slate-700 rounded-lg px-3 py-1.5 text-xs text-slate-100 focus:outline-none focus:border-indigo-500 w-full sm:w-64">
          <button onclick="fetchData()" class="px-3 py-1.5 text-xs bg-slate-800 hover:bg-slate-700 rounded-lg border border-slate-700 transition whitespace-nowrap">🔄 Refresh</button>
        </div>
      </div>
      <div id="book-list" class="grid gap-4 sm:grid-cols-2">
        <p class="text-slate-500 text-sm italic col-span-2">Loading library catalog...</p>
      </div>
    </section>
  </div>

  <script>
    const API_BOOKS = '/api/books';
    const API_USERS = '/api/users';
    let allBooks = [];

    // Set default value for manual date picker to 14 days from today for convenience
    window.addEventListener('DOMContentLoaded', () => {
      const d = new Date();
      d.setDate(d.getDate() + 14);
      document.getElementById('action-duedate').value = d.toISOString().split('T')[0];
    });

    async function fetchData() {
      await fetchUsers();
      await fetchBooks();
    }

    async function fetchUsers() {
      const userListContainer = document.getElementById('user-list');
      try {
        const res = await fetch(API_USERS);
        const users = await res.json();
        
        if (!users.length) {
          userListContainer.innerHTML = `<span class="italic text-slate-500">No members registered yet.</span>`;
          return;
        }

        userListContainer.innerHTML = users.map(u => `
          <div class="flex justify-between items-center bg-slate-900 px-2.5 py-1 rounded border border-slate-700/60">
            <span>ID <strong>${u.id}</strong>: ${escapeHtml(u.full_name)}</span>
            <span class="text-slate-500 text-[10px]">Member</span>
          </div>
        `).join('');
      } catch (err) {
        userListContainer.innerHTML = `<span class="text-rose-400">Failed to load members</span>`;
      }
    }

    async function fetchBooks() {
      const container = document.getElementById('book-list');
      try {
        const res = await fetch(API_BOOKS);
        allBooks = await res.json();
        filterBooks();
      } catch (err) {
        container.innerHTML = `<p class="text-rose-400 text-sm col-span-2">Failed to load catalog: ${err.message}</p>`;
      }
    }

    function filterBooks() {
      const query = document.getElementById('search-input').value.toLowerCase().trim();
      const container = document.getElementById('book-list');

      if (!allBooks.length) {
        container.innerHTML = `<p class="text-slate-500 text-sm italic col-span-2">No books found in the library database.</p>`;
        return;
      }

      const filtered = allBooks.filter(book => {
        const title = (book.title || '').toLowerCase();
        const author = (book.author || '').toLowerCase();
        const isbn = (book.isbn || '').toLowerCase();
        const barcode = (book.barcode_id || '').toLowerCase();
        const borrower = (book.borrower_name || '').toLowerCase();
        return title.includes(query) || author.includes(query) || isbn.includes(query) || barcode.includes(query) || borrower.includes(query);
      });

      if (!filtered.length) {
        container.innerHTML = `<p class="text-slate-500 text-sm italic col-span-2">No matching books found for "${escapeHtml(query)}".</p>`;
        return;
      }

      const grouped = {};
      filtered.forEach(book => {
        const key = book.isbn ? book.isbn.trim() : book.title.trim().toLowerCase();
        if (!grouped[key]) {
          grouped[key] = {
            title: book.title,
            author: book.author,
            isbn: book.isbn,
            copies: []
          };
        }
        grouped[key].copies.push({
          id: book.id,
          barcodeId: book.barcode_id,
          status: book.status,
          ownerId: book.owner_id,
          loanDate: book.loan_date,
          dueDate: book.due_date,
          borrowerName: book.borrower_name
        });
      });

      container.innerHTML = Object.values(grouped).map(group => `
        <div class="bg-slate-800 border border-slate-700 p-5 rounded-xl space-y-3 shadow-md col-span-full">
          <div class="flex justify-between items-start gap-2">
            <div>
              <h3 class="font-bold text-slate-100 text-lg">${escapeHtml(group.title)}</h3>
              <p class="text-xs text-slate-400">by ${escapeHtml(group.author || 'Unknown')} | ISBN: <span class="text-indigo-300">${escapeHtml(group.isbn || 'N/A')}</span></p>
            </div>
            <span class="px-3 py-1 text-xs font-semibold rounded-full bg-indigo-950 text-indigo-400 border border-indigo-800">
              Total Copies: ${group.copies.length}
            </span>
          </div>

          <div class="space-y-2 pt-2 border-t border-slate-700/50">
            <p class="text-xs font-semibold text-slate-400">Physical Copy Status & Loan Details:</p>
            <div class="grid gap-3 sm:grid-cols-2">
              ${group.copies.map(copy => `
                <div class="flex flex-col text-xs bg-slate-900 p-3 rounded-lg border border-slate-700 gap-2">
                  <div class="flex justify-between items-center">
                    <span>Barcode: <code class="font-mono text-indigo-300 font-bold">${escapeHtml(copy.barcodeId)}</code></span>
                    <span class="px-2 py-0.5 rounded-full font-semibold ${
                      copy.status === 'available' ? 'text-emerald-400 bg-emerald-950/50 border border-emerald-800' : 'text-amber-400 bg-amber-950/50 border border-amber-800'
                    }">${copy.status}</span>
                  </div>

                  ${copy.status === 'borrowed' ? `
                    <div class="text-slate-400 pt-2 border-t border-slate-800 space-y-1">
                      <p>👤 <strong>Borrower:</strong> <span class="text-indigo-200">${escapeHtml(copy.borrowerName || 'Unknown User')}</span></p>
                      <p>📅 <strong>Borrowed:</strong> ${copy.loanDate ? new Date(copy.loanDate).toLocaleDateString() : 'N/A'}</p>
                      <p>⏰ <strong>Due Date:</strong> <span class="text-rose-300">${copy.dueDate ? new Date(copy.dueDate).toLocaleDateString() : 'N/A'}</span></p>
                    </div>
                  ` : ''}
                </div>
              `).join('')}
            </div>
          </div>
        </div>
      `).join('');
    }

    // Handle Add Book
    document.getElementById('add-book-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const payload = {
        title: document.getElementById('title').value,
        author: document.getElementById('author').value,
        isbn: document.getElementById('isbn').value,
        barcodeId: document.getElementById('barcodeId').value,
        ownerId: parseInt(document.getElementById('ownerId').value),
        description: "Registered physical book copy"
      };

      try {
        const res = await fetch(API_BOOKS, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        if (data.success) {
          alert('Book added successfully!');
          fetchBooks();
          document.getElementById('add-book-form').reset();
        } else {
          alert('Error: ' + data.error);
        }
      } catch (err) {
        alert('Failed to connect to server.');
      }
    });

    // Handle Register User (Name only)
    document.getElementById('add-user-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const payload = {
        fullName: document.getElementById('user-name').value
      };

      try {
        const res = await fetch(API_USERS, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        if (data.success) {
          alert(`Member registered successfully! User ID is ${data.user.id}`);
          fetchUsers();
          document.getElementById('add-user-form').reset();
        } else {
          alert('Error: ' + data.error);
        }
      } catch (err) {
        alert('Failed to connect to server.');
      }
    });

    // Handle Borrow / Return Action
    async function handleLoan(action) {
      const barcodeId = document.getElementById('action-barcode').value.trim();
      const borrowerId = parseInt(document.getElementById('borrower-id').value);
      const dueDate = document.getElementById('action-duedate').value;

      if (!barcodeId) {
        alert('Please scan or enter a physical copy barcode ID.');
        return;
      }

      const endpoint = action === 'borrow' ? '/api/borrow' : '/api/return';
      const payload = action === 'borrow' ? { barcodeId, borrowerId, dueDate } : { barcodeId };

      try {
        const res = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await res.json();

        if (data.success) {
          alert(data.message);
          fetchBooks();
          document.getElementById('action-barcode').value = '';
        } else {
          alert('Error: ' + data.error);
        }
      } catch (err) {
        alert('Failed to connect to server.');
      }
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
    }

    // Initialize Camera Barcode Scanner for Actions
    function onScanSuccess(decodedText) {
      document.getElementById('action-barcode').value = decodedText;
    }

    const html5QrcodeScanner = new Html5QrcodeScanner("action-reader", { fps: 10, qrbox: { width: 220, height: 120 } }, false);
    html5QrcodeScanner.render(onScanSuccess);

    fetchData();
  </script>
</body>
</html>
